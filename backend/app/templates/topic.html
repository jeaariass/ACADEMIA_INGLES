{% extends 'base.html' %}
{% block content %}
<div class="card p-4 shadow-sm rounded-4">
  <h2>{{ topic.title }}</h2>
  <p class="text-muted">Nivel {{ topic.level.code }}</p>
  <div class="theory">{{ topic.theory }}</div>
  <button class="btn btn-secondary mt-3" onclick="speakText(`{{ topic.theory|replace('`','') }}`)">Escuchar teoría</button>
  <a class="btn btn-primary mt-3" href="{{ url_for('main.test', topic_id=topic.id) }}">Iniciar test</a>
</div>
{% endblock %}
