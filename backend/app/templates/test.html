{% extends 'base.html' %}
{% block content %}
<form method="post" class="card p-4 shadow-sm rounded-4">
  <h2>Test: {{ topic.title }}</h2>
  {% for q in questions %}
  <div class="question-box my-3 p-3 rounded-3">
    <h5>{{ loop.index }}. {{ q.prompt }}</h5>
    {% for key, txt in [('A',q.option_a),('B',q.option_b),('C',q.option_c),('D',q.option_d)] %}
    <div class="form-check">
      <input class="form-check-input" type="radio" name="q_{{ q.id }}" value="{{ key }}" required>
      <label class="form-check-label">{{ key }}. {{ txt }}</label>
    </div>
    {% endfor %}
  </div>
  {% endfor %}
  <button class="btn btn-success">Enviar respuestas</button>
</form>
{% endblock %}
