{% extends 'base.html' %}{% block title %}Edit {{ category.name }} · Game Vocabulary{% endblock %}{% block content %}<section class="page-section game-vocab-admin"><a class="back-link" href="{{ url_for('game_vocab_admin.index') }}"><i class="bi bi-arrow-left"></i> Game Vocabulary</a><section class="content-card mt-3"><div class="content-card-header"><div><span class="eyebrow">EDIT CATEGORY</span><h1>{{ category.visual }} {{ category.name }}</h1><p>Words in this category keep their links when you rename the category.</p></div></div><form method="post" class="game-vocab-form"><label>Code<input class="form-control" name="code" value="{{ category.code }}" required></label><label>Name<input class="form-control" name="name" value="{{ category.name }}" required></label><div class="row g-2"><label class="col-4">Visual<input class="form-control" name="visual" value="{{ category.visual }}"></label><label class="col-8">Order<input class="form-control" type="number" name="sort_order" value="{{ category.sort_order }}"></label></div><div class="form-check"><input class="form-check-input" type="checkbox" name="kids_enabled" id="kids" {% if category.kids_enabled %}checked{% endif %}><label class="form-check-label" for="kids">Kids Mode</label></div><div class="form-check"><input class="form-check-input" type="checkbox" name="standard_enabled" id="std" {% if category.standard_enabled %}checked{% endif %}><label class="form-check-label" for="std">Standard students</label></div><div class="form-check"><input class="form-check-input" type="checkbox" name="is_active" id="active" {% if category.is_active %}checked{% endif %}><label class="form-check-label" for="active">Active</label></div><div class="d-flex gap-2"><a class="btn btn-outline-secondary" href="{{ url_for('game_vocab_admin.index') }}">Cancel</a><button class="btn btn-primary" type="submit">Save category</button></div></form></section></section>{% endblock %}
