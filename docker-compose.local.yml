services:
  postgres:
    image: postgres:16
    container_name: ingles-postgres-local
    environment:
      POSTGRES_DB: english_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - english_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d english_db"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: ingles-backend-local
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/english_db
      FLASK_SECRET_KEY: dev-local-secret-key
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: Admin123*
      STUDENT1_USERNAME: student1
      STUDENT1_PASSWORD: Student123*
      STUDENT2_USERNAME: student2
      STUDENT2_PASSWORD: Student123*
    volumes:
      - ./backend/migrations:/app/migrations
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  english_postgres_data:
