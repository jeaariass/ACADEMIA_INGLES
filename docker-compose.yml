services:
  backend:
    build:
      context: ./backend
    container_name: ingles-backend
    restart: unless-stopped
    env_file: .env
    networks:
      - shared-net
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M

  tunnel:
    image: ngrok/ngrok:latest
    container_name: ingles-tunnel
    restart: unless-stopped
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    command: http ingles-backend:8000 --url=${NGROK_DOMAIN}
    networks:
      - shared-net
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 96M

networks:
  shared-net:
    external: true
