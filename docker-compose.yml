# Stack VPS de English Practice Hub. Copiar a /srv/stacks/academia/ en el servidor
# (plantilla base: /srv/stacks/_plantilla, ver /srv/docs/README.md "Agregar un proyecto").
#
# Build local -> GHCR: scripts/build-and-push.ps1 (Windows). Luego en el VPS:
#   TAG=<commit7> en /srv/stacks/academia/.env
#   /srv/scripts/portainer-stack.sh academia --pull
#
# Requiere en el VPS (una sola vez):
#   /srv/scripts/nueva-bd-app.sh academia         (crea base "academia" + rol "app_academia", escribe DB_* en .env)
#   red externa "ai_net" y stack "ollama" si se usa el generador de historias IA (ver docs/VPS_OLLAMA_REQUEST.md)
name: academia

services:
  backend:
    image: ghcr.io/jeaariass/academia-api:${TAG:?debe definirse TAG}
    container_name: academia-backend
    # Información que muestra el panel (https://panel.../). Aparece sola al desplegar.
    labels:
      panel.tipo: "proyecto"
      panel.nombre: "English Practice Hub"
      panel.descripcion: "Practica de ingles: ejercicios, speaking, writing, juegos, TTS e historias con IA"
      panel.url: "https://academia.179-197-81-33.sslip.io"
      panel.repo: "https://github.com/jeaariass/ACADEMIA_INGLES"
      panel.base: "academia"
      panel.boton: "Abrir"
    restart: unless-stopped
    mem_limit: 512m
    # Portainer guarda las variables en su propio stack.env, no en un .env del host:
    # no usar "env_file" aqui, pasar cada variable explicita (igual que el stack spa).
    environment:
      DATABASE_URL: postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:?debe definirse en .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?debe definirse en .env}
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-false}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      FORCE_HTTPS: ${FORCE_HTTPS:-false}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?debe definirse en .env}
      LOGIN_MAX_FAILURES: ${LOGIN_MAX_FAILURES:-8}
      LOGIN_FAILURE_WINDOW_SECONDS: ${LOGIN_FAILURE_WINDOW_SECONDS:-900}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-180}
      RUN_STARTUP_QA: ${RUN_STARTUP_QA:-0}
      OLLAMA_HOST: ${OLLAMA_HOST:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      TZ: America/Bogota
    # nginx del host hace proxy_pass aqui (ver /srv/docs/README.md seccion 5 "Agregar un proyecto").
    ports:
      - "127.0.0.1:8102:8000"
    networks: [default, db_net, ai_net]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    name: academia_net
  db_net:
    external: true
  # Red compartida del LLM (stack "ollama"). Si no se usa el generador de historias IA,
  # quitar "ai_net" de la lista de redes del servicio y dejar OLLAMA_HOST vacio en .env.
  ai_net:
    external: true
